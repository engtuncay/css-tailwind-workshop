<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="../output.css" rel="stylesheet">
    <style>
      body {
        margin-bottom: 750px;
      }
    </style>
  </head>

  <body class="bg-gray-50">
    <!-- Navbar 1 -->
    <nav class="bg-gray-100 border-b border-gray-300">
      <div class="max-w-full mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <a class="text-lg font-bold text-gray-800" href="#">Navbar</a>
          
          <!-- Toggle Button for Mobile -->
          <button class="md:hidden flex flex-col gap-1 cursor-pointer" id="toggle1" type="button">
            <span class="w-6 h-0.5 bg-gray-800 block"></span>
            <span class="w-6 h-0.5 bg-gray-800 block"></span>
            <span class="w-6 h-0.5 bg-gray-800 block"></span>
          </button>

          <!-- Menu -->
          <div class="hidden md:flex md:flex-row flex-col w-full md:w-auto md:items-center" id="menu1">
            <ul class="flex flex-col md:flex-row md:gap-4 w-full md:w-auto">
              <li class="md:relative">
                <a class="block md:inline-block px-4 py-2 md:py-0 text-blue-600 font-semibold md:border-b-2 md:border-blue-600" href="#">Home</a>
              </li>
              <li>
                <a class="block md:inline-block px-4 py-2 md:py-0 text-gray-700 hover:text-gray-900" href="#">Link</a>
              </li>
              <li class="relative group">
                <button class="block md:inline-block w-full text-left px-4 py-2 md:py-0 text-gray-700 hover:text-gray-900 flex items-center" onclick="toggleDropdown('dropdown1')">
                  Dropdown
                  <svg class="w-4 h-4 ml-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                  </svg>
                </button>
                <ul class="hidden group-hover:block absolute left-0 mt-0 w-48 bg-white border border-gray-200 rounded shadow-lg" id="dropdown1">
                  <li><a class="block px-4 py-2 text-gray-700 hover:bg-gray-100" href="#">Action</a></li>
                  <li><a class="block px-4 py-2 text-gray-700 hover:bg-gray-100" href="#">Another action</a></li>
                  <li><hr class="my-1" /></li>
                  <li><a class="block px-4 py-2 text-gray-700 hover:bg-gray-100" href="#">Something else here</a></li>
                </ul>
              </li>
              <li>
                <a class="block md:inline-block px-4 py-2 md:py-0 text-gray-400 cursor-not-allowed" href="#">Disabled</a>
              </li>
            </ul>
            <form class="flex flex-col md:flex-row gap-2 mt-4 md:mt-0 md:ml-auto w-full md:w-auto">
              <input class="px-3 py-2 border border-gray-300 rounded flex-1 md:flex-none" type="search" placeholder="Search" />
              <button class="px-4 py-2 border-2 border-green-600 text-green-600 rounded hover:bg-green-50" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <br />
    <br />
    <hr />
    <br />

    <!-- Navbar 2 -->
    <nav class="bg-gray-100 border-b border-gray-300">
      <div class="max-w-full mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <a class="text-lg font-bold text-gray-800" href="#">
            <img height="50px" src="img/burgerlogo.png" alt="Logo" />
          </a>
          
          <!-- Toggle Button for Mobile -->
          <button class="md:hidden flex flex-col gap-1 cursor-pointer" id="toggle2" type="button">
            <span class="w-6 h-0.5 bg-gray-800 block"></span>
            <span class="w-6 h-0.5 bg-gray-800 block"></span>
            <span class="w-6 h-0.5 bg-gray-800 block"></span>
          </button>

          <!-- Menu -->
          <div class="hidden md:flex md:flex-row flex-col w-full md:w-auto md:items-center" id="menu2">
            <ul class="flex flex-col md:flex-row md:gap-6 w-full md:w-auto md:ml-auto">
              <li>
                <a class="block md:inline-block px-4 py-2 md:py-0 text-blue-600 font-semibold" href="#">
                  Anasayfa
                </a>
              </li>
              <li>
                <a class="block md:inline-block px-4 py-2 md:py-0 text-gray-700 hover:text-gray-900" href="#">Hakkımızda</a>
              </li>
              <li>
                <a class="block md:inline-block px-4 py-2 md:py-0 text-gray-700 hover:text-gray-900" href="#">Ürünler</a>
              </li>
              <li>
                <a class="block md:inline-block px-4 py-2 md:py-0 text-gray-400 cursor-not-allowed" href="#">Fiyatlar</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <script>
      // Toggle menu for navbar 1
      document.getElementById('toggle1').addEventListener('click', function() {
        const menu = document.getElementById('menu1');
        menu.classList.toggle('hidden');
      });

      // Toggle menu for navbar 2
      document.getElementById('toggle2').addEventListener('click', function() {
        const menu = document.getElementById('menu2');
        menu.classList.toggle('hidden');
      });

      // Toggle dropdown
      function toggleDropdown(id) {
        const dropdown = document.getElementById(id);
        dropdown.classList.toggle('hidden');
      }
    </script>

  </body>
</html>
