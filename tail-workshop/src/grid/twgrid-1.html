<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="../output.css" rel="stylesheet">
</head>

<body class="p-6">

  <!-- SABİT KOLON: 3 kolon belirli -->

  <h2 class="font-bold">Sorunlu: grid-cols-3 (1. silinince boş kalır)</h2>
  <!-- Sabit Grid  -->
  <div class="grid grid-cols-3 gap-4">
    <!-- <div class="bg-red-500 p-4">Sütun 1</div> SİLİNDİ -->
    <div class="bg-blue-500 p-4">Sütun 2</div>
    <div class="bg-green-500 p-4">Sütun 3</div>
  </div>

  <br />
  <h2 class="font-bold mb-2">Dinamik Grid : Çözüm 1: auto-cols-fr (eşit dağılım)</h2>
  <!-- ÇÖZÜM 1: Dinamik grid (eşit dağılım) -->
  <div id="lay2" class="grid auto-cols-fr grid-flow-col gap-4">
    <div class="bg-red-500 p-4">Sütun 1</div>
    <div class="bg-blue-500 p-4">Sütun 2</div>
    <div class="bg-green-500 p-4">Sütun 3</div>
  </div>
  <br/>
  <div id="lay2_1" class="grid grid-flow-col gap-2">
    <div class="bg-red-500 w-72 border-2 border-amber-500">Sütun 1</div>
    <!-- <div class="bg-blue-500 p-4">Sütun 2</div> -->
    <div class="bg-green-500 ">Sütun 3</div>
  </div>

  <!-- ÇÖZÜM 2: Flex kullanımı (çok daha kolay) -->
  <h2 class="font-bold mb-2">Çözüm 2: flex (önerilen)</h2>
  <div class="flex gap-4">
    <!-- <div class="bg-red-500 p-4">Sütun 1</div> SİLİNDİ -->
    <div class="bg-blue-500 p-4 flex-1">Sütun 2</div>
    <div class="bg-green-500 p-4 flex-1">Sütun 3</div>
  </div>
  <br />
  <!-- ÇÖZÜM 3: grid-auto-flow -->
  <h2 class="font-bold mb-2">Çözüm 3: grid-cols-[repeat(auto-fit,minmax(200px,1fr))]</h2>
  <div class="grid gap-4" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
    <!-- <div class="bg-red-500 p-4">Sütun 1</div> SİLİNDİ -->
    <div class="bg-blue-500 p-4">Sütun 2</div>
    <div class="bg-green-500 p-4">Sütun 3</div>
  </div>




</body>

</html>
