<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

<body class="bg-gray-50">
  <div class="container mx-auto px-4 py-8">
    <form class="max-w-md mx-auto">
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input type="email" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Şifre</label>
        <input type="password" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>
      <!-- form-control-lg
            <div class="mb-3">
                <label class="form-label">Şifre</label>
                <input type="password" class="form-control form-control-lg">
            </div> -->
      <!-- form-control-sm
            <div class="mb-3">
                <label class="form-label">Şifre</label>
                <input type="password" class="form-control form-control-sm">
            </div> -->

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Telefon</label>
        <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-100 text-gray-500 cursor-not-allowed" disabled>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Telefon</label>
        <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-gray-100 text-gray-500" value="21312312213" readonly>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Cv Yükle</label>
        <input type="file" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Adres</label>
        <textarea class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" rows="3"></textarea>
      </div>

      <select class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 mb-6">
        <option selected value="">Şehir Seçiniz</option>
        <option value="1">İstanbul</option>
        <option value="2">Ankara</option>
        <option value="3">İzmir</option>
      </select>

      <!-- <select class="form-select form-select-lg mb-3">
                <option selected value="">Şehir Seçiniz</option>
                <option value="1">İstanbul</option>
                <option value="2">Ankara</option>
                <option value="3">İzmir</option>
            </select>

            <select class="form-select form-select-sm mb-3">
                <option selected value="">Şehir Seçiniz</option>
                <option value="1">İstanbul</option>
                <option value="2">Ankara</option>
                <option value="3">İzmir</option>
            </select> -->

      <div class="mb-6">
        <div class="flex items-center">
          <input type="checkbox" id="chk" name="chk" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
          <label class="ml-2 block text-sm text-gray-700" for="chk">Kullanıcı Sözleşmesi</label>
        </div>
      </div>

      <label class="block text-sm font-medium text-gray-700 mb-3">Cinsiyet</label>
      <div class="mb-6 space-y-2">
        <div class="flex items-center">
          <input type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" value="man">
          <label class="ml-2 block text-sm text-gray-700">Erkek</label>
        </div>
        <div class="flex items-center">
          <input type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" value="woman">
          <label class="ml-2 block text-sm text-gray-700">Kadın</label>
        </div>
      </div>

      <label class="block text-sm font-medium text-gray-700 mb-3">Cinsiyet</label>
      <div class="mb-6 flex gap-4">
        <div class="flex items-center">
          <input type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" value="man">
          <label class="ml-2 block text-sm text-gray-700">Erkek</label>
        </div>
        <div class="flex items-center">
          <input type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" value="woman">
          <label class="ml-2 block text-sm text-gray-700">Kadın</label>
        </div>
      </div>


      <label class="block text-sm font-medium text-gray-700 mb-3">Cinsiyet</label>
      <div class="mb-6 space-y-2">
        <div class="flex items-center">
          <input type="radio" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300" name="gender" value="man">
          <label class="ml-2 block text-sm text-gray-700">Erkek</label>
        </div>
        <div class="flex items-center">
          <input type="radio" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300" name="gender" value="woman">
          <label class="ml-2 block text-sm text-gray-700">Kadın</label>
        </div>
      </div>

      <label class="block text-sm font-medium text-gray-700 mb-3">Cinsiyet</label>
      <div class="mb-6 flex gap-4">
        <div class="flex items-center">
          <input type="radio" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300" name="gender" value="man">
          <label class="ml-2 block text-sm text-gray-700">Erkek</label>
        </div>
        <div class="flex items-center">
          <input type="radio" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300" name="gender" value="woman">
          <label class="ml-2 block text-sm text-gray-700">Kadın</label>
        </div>
      </div>

      <label class="block text-sm font-medium text-gray-700 mb-2">Kullanıcı Adı</label>
      <div class="flex mb-6">
        <span class="inline-flex items-center px-3 bg-gray-200 border border-r-0 border-gray-300 rounded-l-md text-gray-600">@</span>
        <input type="text" class="flex-1 px-3 py-2 border border-gray-300 rounded-r-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="Kullanıcı Adınızı Giriniz">
      </div>

      <label class="block text-sm font-medium text-gray-700 mb-2">İş Maili</label>
      <div class="flex mb-6">
        <input type="text" class="flex-1 px-3 py-2 border border-gray-300 rounded-l-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="İş Mailinizi Giriniz">
        <span class="inline-flex items-center px-3 bg-gray-200 border border-l-0 border-gray-300 rounded-r-md text-gray-600">@canboz.com</span>
      </div>

      <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
      <div class="mb-6 relative">
        <input type="email" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 placeholder-transparent" placeholder="canboz@canboz.com">
        <label class="absolute -top-2 left-3 inline-block bg-white px-1 text-xs font-medium text-gray-700">Email</label>
      </div>

      <label class="block text-sm font-medium text-gray-700 mb-2">Şifre</label>
      <div class="mb-6 relative">
        <input type="password" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 placeholder-transparent" placeholder="Password">
        <label class="absolute -top-2 left-3 inline-block bg-white px-1 text-xs font-medium text-gray-700">Şifre</label>
      </div>
    </form>
  </div>
</body>

</html>
