<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="../output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 p-4">
  
  <!-- Trigger Button -->
  <button type="button" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700" onclick="openModal()">
    Open Modal
  </button>

  <!-- Modal Overlay -->
  <div id="modalOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center" onclick="closeModal()">
    <!-- Modal Container -->
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md mx-4 z-50" onclick="event.stopPropagation()">
      <!-- Modal Header -->
      <div class="flex justify-between items-center px-6 py-4 border-b border-gray-200">
        <h5 class="text-lg font-semibold text-gray-900">Modal title</h5>
        <button type="button" class="text-gray-400 hover:text-gray-600 text-2xl font-light" aria-label="Close" onclick="closeModal()">
          &times;
        </button>
      </div>
      
      <!-- Modal Body -->
      <div class="px-6 py-4">
        <p class="text-gray-700">Modal body text goes here.</p>
      </div>
      
      <!-- Modal Footer -->
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
        <button type="button" class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700" onclick="closeModal()">
          Close
        </button>
        <button type="button" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
          Save changes
        </button>
      </div>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('modalOverlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    // Close modal with Escape key
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeModal();
      }
    });
  </script>

</body>
</html>
