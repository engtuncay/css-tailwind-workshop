<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Tailwind Dropdown - Saf JS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">

    <!-- Dropdown Ana Kapsayıcısı -->
    <div class="relative">
        
        <!-- Buton -->
        <button id="dropdownButton" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 focus:outline-none">
            Menü ▾
        </button>

        <!-- Dropdown Menü (Başlangıçta gizli: hidden) -->
        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50 border border-gray-100">
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Profil</a>
            <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Ayarlar</a>
            <div class="border-t border-gray-100 my-1"></div>
            <a href="#" class="block px-4 py-2 text-red-600 hover:bg-gray-50">Çıkış Yap</a>
        </div>

    </div>

    <!-- JavaScript Mantığı -->
    <script>
        const button = document.getElementById('dropdownButton');
        const menu = document.getElementById('dropdownMenu');

        // Butona tıklanınca menüyü aç/kapat
        button.addEventListener('click', (e) => {
            e.stopPropagation(); // Olayın window'a gitmesini engelle
            menu.classList.toggle('hidden');
        });

        // Sayfada herhangi bir yere tıklandığında
        window.addEventListener('click', (e) => {
            // Eğer tıklanan yer menünün veya butonun dışındaysa menüyü kapat
            if (!menu.contains(e.target) && !button.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });
    </script>

</body>
</html>
